name: Mise à jour des matchs

on:
  schedule:
    - cron: "*/30 * * * *"   # scores et statuts ; le guide TV n'est téléchargé qu'une fois par jour (cache)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

      # Même règle que guideDay() dans pipeline/dates.js : la journée de guide commence à 04h00 (Paris).
      - name: Journée du guide TV
        id: guide
        run: echo "day=$(TZ=Europe/Paris date -d '-4 hours' +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: xmltv-${{ steps.guide.outputs.day }}

      - run: npm run build
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
