name: Mise à jour des matchs

on:
  schedule:
    # Heures de match seulement. Cron en UTC : 9h–23h30 UTC = 11h–1h30 (été) / 10h–0h30 (hiver) à Paris.
    # Le guide TV n'est téléchargé qu'une fois par jour (cache).
    - cron: "*/30 9-23 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Le code ne change pas entre deux exécutions planifiées : tests seulement au push / lancement manuel.
      - run: npm test
        if: github.event_name != 'schedule'

      # Même règle que guideDay() dans pipeline/dates.js : la journée de guide commence à 04h00 (Paris).
      - name: Journée du guide TV
        id: guide
        run: echo "day=$(TZ=Europe/Paris date -d '-4 hours' +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: xmltv-${{ steps.guide.outputs.day }}

      - run: npm run build
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
